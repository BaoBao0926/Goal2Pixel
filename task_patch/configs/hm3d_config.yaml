# @package _global_

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: objectnav
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgb_agent
  - /habitat/dataset/objectnav: hm3d
  - override /habitat/task/actions:
      - stop
      - move_forward
      - turn_left
      - turn_right
  - _self_

habitat:
  environment:
    max_episode_steps: 500
  dataset:
    type: "ObjectNav-HM3D"
    split: train
    data_path: ../data/datasets/objectnav/hm3d/{split}/{split}.json.gz
    scenes_dir: ../data/scene_datasets/
  task:
    type: "ObjectNav-v1"
  simulator:
    type: "Sim-v0"
    turn_angle: 30
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [ 0, 0.88, 0 ]
        height: 0.88
        radius: 0.18
    scene_dataset: ../data/scene_datasets/hm3d_v0.2/hm3d_annotated_basis.scene_dataset_config.json

    habitat_sim_v0:
      allow_sliding: True
      enable_physics: True
      gpu_device_id: -1  # Headless mode
      physics_config_file: ../data/default.physics_config.json
