# @package _global_

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: objectnav
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgb_agent
  - /habitat/dataset/objectnav: mp3d
  - override /habitat/task/lab_sensors:
      - compass_sensor
      - gps_sensor
      - mp3d_objectgoal_sensor
  - _self_

habitat:
  environment:
    max_episode_steps: 500
  dataset:
    type: "ObjectNav-MP3D"
    split: train
    data_path: ../data/datasets/objectnav/objectnav_mp3d_70k/{split}/{split}.json.gz
    scenes_dir: ../data/scene_datasets/
    max_replay_steps: 500
    #  Set to a high limit to allow loading episodes with
    #  number of steps greater than ObjectNav episode step
    #  limit in the replay buffer.
  task:
    type: "ObjectNav-MP3D"
  simulator:
    type: "Sim-v0"
    turn_angle: 30
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [ 0, 0.88, 0 ]
        height: 0.88
        radius: 0.18
        max_climb: 0.0
    scene_dataset: ../data/scene_datasets/mp3d/mp3d.scene_dataset_config.json

    habitat_sim_v0:
      allow_sliding: True
      enable_physics: True
      gpu_device_id: -1  # Headless mode
      physics_config_file: ../data/default.physics_config.json
